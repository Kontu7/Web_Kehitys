<!DOCTYPE html>
<html lang="fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaupunkiloma</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <div class="rajaus header-sisalto" >
            <a href="index.html" class="logo">Kaupunkiloma</a>

            <nav class="linkit">
                <a href="index.html">Etusivu</a>
                <a href="matkainfo.html">Matkainfo</a>
                <a href="matkatoive.html"><strong>Matkatoive</strong></a>
            </nav>
        </div>
    </header>

    <main>
          <form action="#" class="form">
            <div class="lomake">
            <label for="email">Sähköposti*</label>
            <input type="email" id="email" required>
            </div>

            <div class="lomake">
                <label for="Sijainti">Matkakohde*</label>
                <select name="Sijainti" id="Sijainti" required>
                    <option value="">-Valitse Vaihtoehto-</option >
                    <option value="Kokkola">Kokkola</option>
                    <option value="Helsinki">Helsinki</option>
                    <option value="Oulu">Oulu</option>
                </select>
            </div>

            <div class="lomake">
                <label for="Ajankohta">Päivämäärä*</label>
                <input type="date" id="Ajankohta" name="Ajankohta" required>
            </div>

            <div class="lomake">
                <label for="Matkustajat">Matkustajien määrä*</label>
                <input type="number" id="Matkustajat" name="Matkustajat" required min="1" max="8">
            </div>

            <div class="lomake">
           <button type="submit">Lähetä matkatoive</button>
           </div>
          
        </form>
       

    </main>




    <footer>
        <div>
        <p class="footer-otsikko">Yhteystiedot</p>
        <p>Puh: +358 1231231231</p>
        <p>Kokkola</p>
        </div>
    </footer>
    
</body>
</html>
