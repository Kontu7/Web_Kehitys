<head>
    <meta charset="UTF-8">

    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <title>Centria Edu | Basics of Web Development</title>


</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#topics">Topics</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <div class="hero-content">

                    <span class="label">Basics of Web Development</span>

                    <h1>
                        Learn how the web works.
                    </h1>

                    <p>
                        Start from HTML and CSS and gradually build modern,
                        responsive and interactive web applications.
                    </p>



                </div>
            </div>
        </section>

        <section class="topics" id="contact">
            <div class="container">

                <h2>Contact us</h2>

                <form class="card" action="https://httpbin.org/post" method="post">
                    <div class="form-row">
                    <label for="name">Name: </label>
                    <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-row">
                    <label for="email">Email: </label>
                    <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-row">
                    <label for="telephone">Telephone: </label>
                    <input type="tel" id="telephone" name="telephone">
                    </div>

                    <div class="form-row">
                    <label for="subject">Subject:</label>
                    <select name="subject" id="subject" required>
                    

                    <option value="">Select subject</option>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Support">Support</option>
                    <option value="Feedback">Feedback</option>

                    </select>
                    </div>
                    <div class="form-row">
                    <label for="contactmethod">How would you like to get contacted?</label>
                    <label for="phone">Phone</label>
                    <input type="radio" name="contactmethod" id="contactmethod" value="phone">
                    <label for="email">Email</label>
                    <input type="radio" name="contactmethod" id="contactmethod" value="email" checked>
                    </div>

                    <div class="form-row">
                    <label for="message">Message: </label>
                    <input type="textarea" id="message" name="message" required>
                    </div>

                    <div class="form-row">
                    <button type="submit">Send</button>
                </form>







            </div>


            </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>

</html>
